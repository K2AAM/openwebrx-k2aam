name: Receiver UI

on:
  push:
    branches: [ale-scanlists]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ale-decoder:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Build receive-only decoder
        run: make -C contrib/ale/decoder
      - name: Scanner, log and protocol tests (no reference audio needed)
        run: python3 -m unittest contrib/ale/tests/test_server_scan.py contrib/ale/tests/test_log.py contrib/ale/tests/test_mobile_scan.py -v
      # The sample host is often slow from CI; keep the verified file between runs.
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: contrib/ale/decoder/test-data
          key: ale-reference-audio-90d1a75ef48c7802
      - name: Download verified upstream reference audio
        run: python3 contrib/ale/decoder/fetch_test_audio.py
      - name: Reference audio, parser and scanner tests
        run: python3 -m unittest discover -s contrib/ale/tests -v
      - name: Address and undefined-behavior sanitizer tests
        run: |
          make -C contrib/ale/decoder TARGET=/tmp/owrx-ale-sanitize CXXFLAGS='-O1 -g -std=c++17 -fsanitize=address,undefined -fno-omit-frame-pointer'
          ASAN_OPTIONS=detect_leaks=0 ALE_BINARY=/tmp/owrx-ale-sanitize python3 -m unittest discover -s contrib/ale/tests -v
  receiver-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium webkit
      - name: Validate JavaScript syntax
        run: |
          for file in htdocs/plugins.js htdocs/plugins/receiver/init.js htdocs/plugins/receiver/*/*.js; do
            node --check "$file"
          done
      - name: Antenna switcher tests
        run: python3 -m unittest discover -s contrib/antenna/tests -v
      - name: ALE scanner state and catalog tests
        run: |
          node contrib/ale/tests/scanner.cjs
          node contrib/ale/tests/observer.cjs
      - name: Receiver browser tests
        run: npm run test:receiver
      - name: Mobile WebKit startup tests
        run: npm run test:startup:webkit
