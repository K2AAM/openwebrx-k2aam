name: Receiver UI

on:
  push:
    branches: [k2aam-ui]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  receiver-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Validate JavaScript syntax
        run: |
          node --check htdocs/plugins.js
          node --check htdocs/plugins/receiver/rig_dock/bootstrap.js
          node --check htdocs/plugins/receiver/rig_dock/rig_dock.js
          node --check htdocs/plugins/receiver/rig_audio/rig_audio.js
      - name: Installer and update tests
        run: python3 -m unittest discover -s contrib/rig_dock/tests -v
      - name: Receiver browser tests
        run: npm run test:receiver
